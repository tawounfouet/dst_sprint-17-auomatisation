name: Terraform Project Final

on:
  push:
    paths:
      - "192 - Terraform DevOps/Projet_Final/wordpress-aws/**"
      - ".github/workflows/terraform-project-final.yml"
  pull_request:
    paths:
      - "192 - Terraform DevOps/Projet_Final/wordpress-aws/**"
      - ".github/workflows/terraform-project-final.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "192 - Terraform DevOps/Projet_Final/wordpress-aws"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Validate bootstrap shell syntax
        run: bash -n modules/ec2/user_data.sh.tftpl

      - name: Reject obvious committed AWS access keys
        shell: bash
        run: |
          if grep -R --line-number --extended-regexp 'AKIA[0-9A-Z]{16}' . --exclude-dir=.terraform; then
            echo "Potential AWS access key detected in the project."
            exit 1
          fi
