name: Ansible Django PostgreSQL Redis Celery Mono-Host Qualification

on:
  push:
    branches:
      - feat/ansible-django-postgresql-redis-celery
    paths:
      - '191 - Ansible DevOps/Projet_Final/django-postgresql-redis-celery/**'
      - '.github/workflows/ansible-django-postgresql-redis-celery-monohost.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redis-celery-monohost-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PROJECT_DIR: 191 - Ansible DevOps/Projet_Final/django-postgresql-redis-celery/ansible-project

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible E2E dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install 'ansible-core>=2.17,<2.21' docker PyYAML
          cd "$PROJECT_DIR"
          ansible-galaxy collection install -r requirements.yml
          ansible-galaxy collection install -r requirements-e2e.yml

      - name: Run Redis Celery Beat mono-host qualification
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash tests/e2e/run_monohost_redis_celery_qualification.sh

      - name: Write CI qualification manifest
        if: success()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -Eeuo pipefail
          MANIFEST="../evidence/validation/redis-celery-rc11-ci-${GITHUB_RUN_ID}.txt"
          {
            echo "workflow=Ansible Django PostgreSQL Redis Celery Mono-Host Qualification"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "git_sha=${GITHUB_SHA}"
            echo "topology=single-server"
            echo "inventory_host=server1"
            echo "roles=common,postgresql,redis,django_app,celery,celery_beat,nginx"
            echo "postgresql=127.0.0.1:5432"
            echo "redis=127.0.0.1:6379"
            echo "gunicorn=127.0.0.1:8000"
            echo "nginx=0.0.0.0:80"
            echo "celery_worker=datascientest-celery"
            echo "celery_beat=datascientest-celery-beat"
            echo "async_add=21+21->42"
            echo "async_database_probe=SELECT 1"
            echo "beat_schedule=datascientest-demo-heartbeat"
            echo "network_contract=80:true,8000:false,5432:false,6379:false"
            echo "idempotence_server1=changed=0"
            echo "post_idempotence_runtime=green"
            echo "rc10=green"
            echo "rc11=green"
          } | tee "$MANIFEST"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ansible-django-postgresql-redis-celery-failure-${{ github.run_id }}
          path: |
            191 - Ansible DevOps/Projet_Final/django-postgresql-redis-celery/evidence/logs/*
            191 - Ansible DevOps/Projet_Final/django-postgresql-redis-celery/evidence/validation/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload RC-11 qualification evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ansible-django-postgresql-redis-celery-rc11-${{ github.run_id }}
          path: |
            191 - Ansible DevOps/Projet_Final/django-postgresql-redis-celery/evidence/logs/*.txt
            191 - Ansible DevOps/Projet_Final/django-postgresql-redis-celery/evidence/validation/*
          if-no-files-found: error
          retention-days: 14
