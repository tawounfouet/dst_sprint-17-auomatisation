---
celery_beat_service_name: datascientest-celery-beat
celery_app_module: config
celery_beat_loglevel: INFO
celery_beat_demo_interval_seconds: 30

django_system_user: django
django_system_group: django
django_install_dir: /opt/datascientest-django
django_venv_dir: "{{ django_install_dir }}/.venv"
django_environment_file: /etc/datascientest-django/django.env
django_allowed_hosts: "localhost,127.0.0.1,{{ inventory_hostname }},{{ ansible_host | default(inventory_hostname) }}"
django_debug: false

postgresql_database: django_app
postgresql_user: django_app
postgresql_port: 5432
postgresql_host: "{{ hostvars[groups['database'][0]].ansible_host }}"
postgresql_password: "{{ vault_postgresql_password }}"

redis_host: 127.0.0.1
redis_port: 6379
redis_broker_database: 0
redis_result_database: 1
redis_password: "{{ vault_redis_password }}"
celery_broker_url: "redis://:{{ redis_password | urlencode }}@{{ redis_host }}:{{ redis_port }}/{{ redis_broker_database }}"
celery_result_backend: "redis://:{{ redis_password | urlencode }}@{{ redis_host }}:{{ redis_port }}/{{ redis_result_database }}"
celery_result_expires: 3600

django_secret_key: "{{ vault_django_secret_key }}"
