---
- name: Validate Compose deployment contract
  ansible.builtin.assert:
    that:
      - compose_stack_environment in compose_stack_allowed_environments
      - compose_stack_app_image | length > 0
      - compose_stack_runtime_environment is mapping
      - compose_stack_required_runtime_keys | difference(compose_stack_runtime_environment.keys() | list) | length == 0
      - compose_stack_runtime_environment.APPLICATION_ENV == compose_stack_environment
      - compose_stack_runtime_environment.APP_IMAGE == compose_stack_app_image
    fail_msg: >-
      compose_stack requires a supported environment, an APP_IMAGE and the
      complete runtime environment contract.
    quiet: true
  no_log: true

- name: Validate sensitive runtime values
  ansible.builtin.assert:
    that:
      - compose_stack_runtime_environment.DJANGO_SECRET_KEY | length >= compose_stack_django_secret_key_min_length
      - compose_stack_runtime_environment.POSTGRES_PASSWORD | length >= compose_stack_postgresql_password_min_length
      - compose_stack_runtime_environment.REDIS_PASSWORD | length >= compose_stack_redis_password_min_length
      - compose_stack_runtime_environment.DJANGO_SECRET_KEY != compose_stack_runtime_environment.POSTGRES_PASSWORD
      - compose_stack_runtime_environment.DJANGO_SECRET_KEY != compose_stack_runtime_environment.REDIS_PASSWORD
      - compose_stack_runtime_environment.POSTGRES_PASSWORD != compose_stack_runtime_environment.REDIS_PASSWORD
      - "'CHANGE_ME' not in compose_stack_runtime_environment.DJANGO_SECRET_KEY"
      - "'CHANGE_ME' not in compose_stack_runtime_environment.POSTGRES_PASSWORD"
      - "'CHANGE_ME' not in compose_stack_runtime_environment.REDIS_PASSWORD"
      - "'REPLACE_ME' not in compose_stack_runtime_environment.DJANGO_SECRET_KEY"
      - "'REPLACE_ME' not in compose_stack_runtime_environment.POSTGRES_PASSWORD"
      - "'REPLACE_ME' not in compose_stack_runtime_environment.REDIS_PASSWORD"
      - "'SET_IN_ENCRYPTED_VAULT' not in compose_stack_runtime_environment.DJANGO_SECRET_KEY"
      - "'SET_IN_ENCRYPTED_VAULT' not in compose_stack_runtime_environment.POSTGRES_PASSWORD"
      - "'SET_IN_ENCRYPTED_VAULT' not in compose_stack_runtime_environment.REDIS_PASSWORD"
    fail_msg: >-
      Runtime secrets must satisfy minimum lengths, must be distinct and must
      not contain placeholder markers.
    quiet: true
  no_log: true

- name: Validate derived service URLs
  ansible.builtin.assert:
    that:
      - compose_stack_runtime_environment.DATABASE_URL is match('^postgresql://')
      - "'@db:5432/' in compose_stack_runtime_environment.DATABASE_URL"
      - "'sqlite' not in (compose_stack_runtime_environment.DATABASE_URL | lower)"
      - compose_stack_runtime_environment.CELERY_BROKER_URL is match('^redis://')
      - compose_stack_runtime_environment.CELERY_RESULT_BACKEND is match('^redis://')
      - "'@redis:6379/' in compose_stack_runtime_environment.CELERY_BROKER_URL"
      - "'@redis:6379/' in compose_stack_runtime_environment.CELERY_RESULT_BACKEND"
    fail_msg: >-
      DATABASE_URL and Celery Redis URLs must target the internal Compose
      services using the expected schemes and service names.
    quiet: true
  no_log: true

- name: Require immutable application image digest for staging and production
  ansible.builtin.assert:
    that:
      - compose_stack_app_image is match('^.+@sha256:[0-9a-fA-F]{64}$')
    fail_msg: >-
      STG and PROD require APP_IMAGE to be an immutable image reference ending
      with @sha256:<64-hex-digest>.
    quiet: true
  when: compose_stack_environment in compose_stack_digest_required_environments

- name: Validate Django settings module matches deployment environment
  ansible.builtin.assert:
    that:
      - compose_stack_runtime_environment.DJANGO_SETTINGS_MODULE == 'config.settings.' ~ compose_stack_environment
      - compose_stack_environment == 'dev' or compose_stack_runtime_environment.DJANGO_DEBUG == 'false'
    fail_msg: >-
      DJANGO_SETTINGS_MODULE must match deployment_environment exactly and
      DJANGO_DEBUG must be false outside development.
    quiet: true

- name: Create Compose release directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ compose_stack_release_root }}"
    - "{{ compose_stack_project_directory }}"

- name: Deploy Compose definitions and service configuration
  ansible.builtin.copy:
    src: "{{ compose_stack_source_directory }}/"
    dest: "{{ compose_stack_project_directory }}/"
    owner: root
    group: root
    directory_mode: '0755'
    mode: preserve

- name: Ensure Redis runtime entrypoint is executable
  ansible.builtin.file:
    path: "{{ compose_stack_project_directory }}/redis/entrypoint.sh"
    owner: root
    group: root
    mode: '0555'
    state: file

- name: Deploy application build context for DEV Full
  ansible.builtin.copy:
    src: "{{ compose_stack_application_source_directory }}/"
    dest: "{{ compose_stack_application_directory }}/"
    owner: root
    group: root
    directory_mode: '0755'
    mode: preserve
  when:
    - compose_stack_environment == 'dev'
    - compose_stack_copy_application_source_in_dev | bool

- name: Remove legacy plaintext runtime environment files
  ansible.builtin.file:
    path: "{{ compose_stack_project_directory }}/{{ item }}"
    state: absent
  loop: "{{ compose_stack_legacy_runtime_secret_files }}"
  no_log: true

- name: Render protected Compose runtime environment
  ansible.builtin.template:
    src: runtime.env.j2
    dest: "{{ compose_stack_project_directory }}/{{ compose_stack_runtime_env_file }}"
    owner: "{{ compose_stack_runtime_env_owner }}"
    group: "{{ compose_stack_runtime_env_group }}"
    mode: "{{ compose_stack_runtime_env_mode }}"
    backup: false
  no_log: true

- name: Inspect protected runtime environment metadata
  ansible.builtin.stat:
    path: "{{ compose_stack_project_directory }}/{{ compose_stack_runtime_env_file }}"
  register: compose_stack_runtime_env_stat

- name: Enforce protected runtime environment permissions
  ansible.builtin.assert:
    that:
      - compose_stack_runtime_env_stat.stat.exists
      - compose_stack_runtime_env_stat.stat.isreg
      - compose_stack_runtime_env_stat.stat.uid == 0
      - compose_stack_runtime_env_stat.stat.gid == 0
      - compose_stack_runtime_env_stat.stat.mode == compose_stack_runtime_env_mode
    fail_msg: >-
      The Compose runtime environment must be a root-owned regular file with
      mode {{ compose_stack_runtime_env_mode }}.
    quiet: true

- name: Validate merged Compose configuration
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ compose_stack_runtime_env_file }}"
      - -f
      - "{{ compose_stack_base_file }}"
      - -f
      - "{{ compose_stack_overlay_file }}"
      - config
      - --quiet
    chdir: "{{ compose_stack_project_directory }}"
  changed_when: false
  no_log: true

- name: Start backing services and web release process
  community.docker.docker_compose_v2:
    project_src: "{{ compose_stack_project_directory }}"
    project_name: "{{ compose_stack_project_name }}"
    files: "{{ compose_stack_files }}"
    env_files:
      - "{{ compose_stack_runtime_env_file }}"
    services:
      - db
      - redis
      - web
    state: present
    pull: "{{ compose_stack_pull_policy }}"
    build: "{{ compose_stack_build_policy }}"
    remove_orphans: false
    wait: true
    wait_timeout: "{{ compose_stack_wait_timeout }}"
  no_log: true

- name: Apply Django database migrations as one-off process
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ compose_stack_runtime_env_file }}"
      - -f
      - "{{ compose_stack_base_file }}"
      - -f
      - "{{ compose_stack_overlay_file }}"
      - run
      - --rm
      - --no-deps
      - web
      - python
      - manage.py
      - migrate
      - --noinput
    chdir: "{{ compose_stack_project_directory }}"
  register: compose_stack_migrate_result
  changed_when: "'No migrations to apply.' not in compose_stack_migrate_result.stdout"
  no_log: true

- name: Collect Django static assets as one-off process
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ compose_stack_runtime_env_file }}"
      - -f
      - "{{ compose_stack_base_file }}"
      - -f
      - "{{ compose_stack_overlay_file }}"
      - run
      - --rm
      - --no-deps
      - web
      - python
      - manage.py
      - collectstatic
      - --noinput
    chdir: "{{ compose_stack_project_directory }}"
  register: compose_stack_collectstatic_result
  changed_when: "'0 static files copied' not in compose_stack_collectstatic_result.stdout"
  no_log: true

- name: Ensure demo periodic task exists as one-off admin process
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ compose_stack_runtime_env_file }}"
      - -f
      - "{{ compose_stack_base_file }}"
      - -f
      - "{{ compose_stack_overlay_file }}"
      - run
      - --rm
      - --no-deps
      - web
      - python
      - manage.py
      - ensure_demo_periodic_task
      - --seconds
      - "30"
    chdir: "{{ compose_stack_project_directory }}"
  register: compose_stack_periodic_task_result
  changed_when: "compose_stack_periodic_task_result.stdout | trim != 'unchanged'"
  no_log: true

- name: Converge complete Docker Compose application stack
  community.docker.docker_compose_v2:
    project_src: "{{ compose_stack_project_directory }}"
    project_name: "{{ compose_stack_project_name }}"
    files: "{{ compose_stack_files }}"
    env_files:
      - "{{ compose_stack_runtime_env_file }}"
    state: present
    pull: "{{ compose_stack_pull_policy }}"
    build: "never"
    remove_orphans: "{{ compose_stack_remove_orphans }}"
    wait: "{{ compose_stack_wait }}"
    wait_timeout: "{{ compose_stack_wait_timeout }}"
  register: compose_stack_converge_result
  no_log: true

- name: Validate Compose project is visible
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ compose_stack_runtime_env_file }}"
      - -f
      - "{{ compose_stack_base_file }}"
      - -f
      - "{{ compose_stack_overlay_file }}"
      - ps
      - --all
    chdir: "{{ compose_stack_project_directory }}"
  register: compose_stack_ps_result
  changed_when: false
  no_log: true
