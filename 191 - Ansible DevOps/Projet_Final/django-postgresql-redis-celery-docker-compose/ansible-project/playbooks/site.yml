---
- name: Validate Docker Compose mono-host topology
  hosts: localhost
  gather_facts: false
  become: false
  tags:
    - always
    - topology
  tasks:
    - name: Validate single app host and reject legacy database topology
      ansible.builtin.assert:
        that:
          - "'app' in groups"
          - "groups['app'] | length == 1"
          - "'database' not in groups or groups['database'] | length == 0"
        fail_msg: >-
          The Docker Compose variant expects exactly one host in the 'app'
          group and no active legacy 'database' group.
        quiet: true

- name: Converge Docker Compose application host
  hosts: app
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "../inventories/{{ deployment_environment }}/group_vars/vault.yml"
  pre_tasks:
    - name: Validate deployment environment
      ansible.builtin.assert:
        that:
          - deployment_environment in ['dev', 'stg', 'prod']
        fail_msg: deployment_environment must be dev, stg or prod.
        quiet: true
      tags:
        - always

    - name: Validate runtime secrets
      ansible.builtin.assert:
        that:
          - vault_postgresql_password is defined
          - vault_postgresql_password | length >= 16
          - vault_postgresql_password != 'CHANGE_ME_POSTGRES_PASSWORD'
          - vault_redis_password is defined
          - vault_redis_password | length >= 16
          - vault_redis_password != 'CHANGE_ME_REDIS_PASSWORD'
          - vault_django_secret_key is defined
          - vault_django_secret_key | length >= 32
          - vault_django_secret_key != 'CHANGE_ME_DJANGO_SECRET_KEY'
        fail_msg: >-
          Runtime secrets must be defined in the encrypted Vault file for the
          selected environment.
        quiet: true
      no_log: true
      tags:
        - always
        - secrets

  roles:
    - role: common
      tags:
        - common

    - role: docker_engine
      tags:
        - docker
        - docker_engine

    - role: compose_stack
      tags:
        - compose
        - compose_stack
