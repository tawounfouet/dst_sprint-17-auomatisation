---
- name: Validate Docker Compose mono-host topology
  hosts: localhost
  gather_facts: false
  become: false
  tags:
    - always
    - topology
  tasks:
    - name: Validate single app host and reject legacy database topology
      ansible.builtin.assert:
        that:
          - "'app' in groups"
          - "groups['app'] | length == 1"
          - "'database' not in groups or groups['database'] | length == 0"
        fail_msg: >-
          The Docker Compose variant expects exactly one host in the 'app'
          group and no active legacy 'database' group.
        quiet: true

- name: Converge Docker Compose application host
  hosts: app
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "../inventories/{{ deployment_environment }}/group_vars/vault.yml"
  pre_tasks:
    - name: Validate deployment environment
      ansible.builtin.assert:
        that:
          - deployment_environment in ['dev', 'stg', 'prod']
        fail_msg: deployment_environment must be dev, stg or prod.
        quiet: true
      tags:
        - always

    - name: Validate Vault environment binding and secret quality
      ansible.builtin.assert:
        that:
          - (vault_environment | default('')) == deployment_environment
          - (vault_secret_generation | default(0) | int) >= 1
          - (vault_postgresql_password | default('')) | length >= 24
          - (vault_redis_password | default('')) | length >= 24
          - (vault_django_secret_key | default('')) | length >= 50
          - "'CHANGE_ME' not in (vault_postgresql_password | default('CHANGE_ME'))"
          - "'CHANGE_ME' not in (vault_redis_password | default('CHANGE_ME'))"
          - "'CHANGE_ME' not in (vault_django_secret_key | default('CHANGE_ME'))"
          - "'REPLACE_ME' not in (vault_postgresql_password | default('REPLACE_ME'))"
          - "'REPLACE_ME' not in (vault_redis_password | default('REPLACE_ME'))"
          - "'REPLACE_ME' not in (vault_django_secret_key | default('REPLACE_ME'))"
          - "'SET_IN_ENCRYPTED_VAULT' not in (vault_postgresql_password | default('SET_IN_ENCRYPTED_VAULT'))"
          - "'SET_IN_ENCRYPTED_VAULT' not in (vault_redis_password | default('SET_IN_ENCRYPTED_VAULT'))"
          - "'SET_IN_ENCRYPTED_VAULT' not in (vault_django_secret_key | default('SET_IN_ENCRYPTED_VAULT'))"
          - vault_postgresql_password != vault_redis_password
          - vault_postgresql_password != vault_django_secret_key
          - vault_redis_password != vault_django_secret_key
        fail_msg: >-
          The selected Vault must be bound to the same deployment environment,
          expose generation >= 1, use distinct non-placeholder secrets, and
          satisfy the minimum secret lengths.
        quiet: true
      no_log: true
      tags:
        - always
        - secrets

  roles:
    - role: common
      tags:
        - common

    - role: docker_engine
      tags:
        - docker
        - docker_engine

    - role: compose_stack
      tags:
        - compose
        - compose_stack
