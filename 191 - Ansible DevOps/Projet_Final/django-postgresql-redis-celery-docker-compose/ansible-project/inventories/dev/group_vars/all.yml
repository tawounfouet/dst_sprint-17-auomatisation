---
deployment_environment: dev
application_name: dst-ansible-django
app_image: datascientest-django:dev
application_version: 0.0.0-dev
application_commit: local

postgresql_database: django_app
postgresql_user: django_app
redis_broker_database: 0
redis_result_database: 1

compose_stack_runtime_environment:
  APP_IMAGE: "{{ app_image }}"
  APPLICATION_NAME: "{{ application_name }}"
  APPLICATION_ENV: dev
  APPLICATION_VERSION: "{{ application_version }}"
  APPLICATION_COMMIT: "{{ application_commit }}"
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_SECRET_KEY: "{{ vault_django_secret_key }}"
  DJANGO_DEBUG: "true"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web,nginx
  DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
  DATABASE_URL: "postgresql://{{ postgresql_user | urlencode }}:{{ vault_postgresql_password | urlencode }}@db:5432/{{ postgresql_database | urlencode }}"
  CELERY_BROKER_URL: "redis://:{{ vault_redis_password | urlencode }}@redis:6379/{{ redis_broker_database }}"
  CELERY_RESULT_BACKEND: "redis://:{{ vault_redis_password | urlencode }}@redis:6379/{{ redis_result_database }}"
  CELERY_RESULT_EXPIRES: "3600"
  POSTGRES_DB: "{{ postgresql_database }}"
  POSTGRES_USER: "{{ postgresql_user }}"
  POSTGRES_PASSWORD: "{{ vault_postgresql_password }}"
  REDIS_PASSWORD: "{{ vault_redis_password }}"
  USE_S3_STORAGE: "true"
  AWS_STORAGE_BUCKET_NAME: dst-media
  AWS_ACCESS_KEY_ID: "{{ vault_minio_root_user | default('minioadmin') }}"
  AWS_SECRET_ACCESS_KEY: "{{ vault_minio_root_password | default(vault_postgresql_password) }}"
  AWS_S3_ENDPOINT_URL: http://minio:9000
  AWS_S3_ADDRESSING_STYLE: path
  MINIO_ROOT_USER: "{{ vault_minio_root_user | default('minioadmin') }}"
  MINIO_ROOT_PASSWORD: "{{ vault_minio_root_password | default(vault_postgresql_password) }}"
  NGINX_HTTP_PORT: "8080"
  SMTP_HOST: "{{ vault_smtp_host | default('') }}"
  SMTP_PORT: "{{ vault_smtp_port | default('') }}"
  SMTP_USER: "{{ vault_smtp_user | default('') }}"
  SMTP_PASSWORD: "{{ vault_smtp_password | default('') }}"
  SMTP_USE_SSL: "{{ vault_smtp_use_ssl | default('') }}"
  SMTP_USE_TLS: "{{ vault_smtp_use_tls | default('') }}"
  DEFAULT_FROM_EMAIL: "{{ vault_default_from_email | default('') }}"
  IMAP_HOST: "{{ vault_imap_host | default('') }}"
  IMAP_PORT: "{{ vault_imap_port | default('') }}"
  IMAP_USER: "{{ vault_imap_user | default('') }}"
  IMAP_PASSWORD: "{{ vault_imap_password | default('') }}"
  IMAP_USE_SSL: "{{ vault_imap_use_ssl | default('') }}"
  DJANGO_LOG_LEVEL: DEBUG
