---
deployment_environment: prod
app_image: registry.example.com/datascientest-django@sha256:CHANGE_ME_WITH_64_HEX_DIGEST
application_version: CHANGE_ME_VERSION
application_commit: CHANGE_ME_COMMIT

postgresql_database: django_app
postgresql_user: django_app
redis_broker_database: 0
redis_result_database: 1

compose_stack_runtime_environment:
  APP_IMAGE: "{{ app_image }}"
  APPLICATION_ENV: prod
  APPLICATION_VERSION: "{{ application_version }}"
  APPLICATION_COMMIT: "{{ application_commit }}"
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_SECRET_KEY: "{{ vault_django_secret_key }}"
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,example.com,web,nginx
  DJANGO_CSRF_TRUSTED_ORIGINS: https://example.com
  DATABASE_URL: "postgresql://{{ postgresql_user | urlencode }}:{{ vault_postgresql_password | urlencode }}@db:5432/{{ postgresql_database | urlencode }}"
  CELERY_BROKER_URL: "redis://:{{ vault_redis_password | urlencode }}@redis:6379/{{ redis_broker_database }}"
  CELERY_RESULT_BACKEND: "redis://:{{ vault_redis_password | urlencode }}@redis:6379/{{ redis_result_database }}"
  CELERY_RESULT_EXPIRES: "3600"
  POSTGRES_DB: "{{ postgresql_database }}"
  POSTGRES_USER: "{{ postgresql_user }}"
  POSTGRES_PASSWORD: "{{ vault_postgresql_password }}"
  REDIS_PASSWORD: "{{ vault_redis_password }}"
  USE_S3_STORAGE: "true"
  AWS_STORAGE_BUCKET_NAME: "{{ vault_aws_storage_bucket_name | default('dst-media-prod') }}"
  AWS_ACCESS_KEY_ID: "{{ vault_aws_access_key_id }}"
  AWS_SECRET_ACCESS_KEY: "{{ vault_aws_secret_access_key }}"
  AWS_S3_REGION_NAME: "{{ aws_s3_region_name | default('eu-west-3') }}"
  AWS_S3_ADDRESSING_STYLE: auto
  NGINX_HTTP_BIND_ADDRESS: 0.0.0.0
  NGINX_HTTP_PORT: "80"
  SMTP_HOST: smtp.resend.com
  SMTP_PORT: "465"
  SMTP_USER: resend
  SMTP_PASSWORD: "{{ vault_resend_api_key | default(vault_smtp_password | default('')) }}"
  SMTP_USE_TLS: "false"
  SMTP_USE_SSL: "true"
  DEFAULT_FROM_EMAIL: "{{ vault_default_from_email | default('notifications@example.com') }}"
  IMAP_HOST: "{{ vault_imap_host | default('') }}"
  IMAP_PORT: "{{ vault_imap_port | default('993') }}"
  IMAP_USER: "{{ vault_imap_user | default('') }}"
  IMAP_PASSWORD: "{{ vault_imap_password | default('') }}"
  IMAP_USE_SSL: "true"
  DJANGO_LOG_LEVEL: INFO
