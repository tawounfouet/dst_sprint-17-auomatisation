x-release-image: &release-image "${APP_IMAGE:?APP_IMAGE is required for STG; use an immutable registry reference with @sha256 digest}"

x-stg-environment: &stg-environment
  APPLICATION_ENV: stg
  DJANGO_SETTINGS_MODULE: config.settings.stg
  DJANGO_DEBUG: "false"

services:
  web:
    image: *release-image
    environment:
      <<: *stg-environment

  worker:
    image: *release-image
    environment:
      <<: *stg-environment

  beat:
    image: *release-image
    environment:
      <<: *stg-environment

  nginx:
    ports:
      - "${NGINX_HTTP_BIND_ADDRESS:-0.0.0.0}:${NGINX_HTTP_PORT:-80}:80"
