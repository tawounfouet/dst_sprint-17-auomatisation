x-release-image: &release-image "${APP_IMAGE:?APP_IMAGE is required for PROD; promote the exact STG @sha256 digest}"

x-prod-environment: &prod-environment
  APPLICATION_ENV: prod
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_DEBUG: "false"

services:
  web:
    image: *release-image
    environment:
      <<: *prod-environment

  worker:
    image: *release-image
    environment:
      <<: *prod-environment

  beat:
    image: *release-image
    environment:
      <<: *prod-environment

  nginx:
    ports:
      - "${NGINX_HTTP_BIND_ADDRESS:-0.0.0.0}:${NGINX_HTTP_PORT:-80}:80"

  minio:
    profiles:
      - storage-local

  minio-create-bucket:
    profiles:
      - storage-local
