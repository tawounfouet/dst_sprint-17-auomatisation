x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-3}

x-app-service: &app-service
  image: ${APP_IMAGE:-datascientest-django:dev}
  environment: &app-environment
    APPLICATION_NAME: ${APPLICATION_NAME:-dst-ansible-django}
    APPLICATION_ENV: ${APPLICATION_ENV:-dev}
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web,nginx}
    DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for DEV Full / STG / PROD}
    CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
    CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND is required}
    CELERY_RESULT_EXPIRES: ${CELERY_RESULT_EXPIRES:-3600}
    CELERY_BEAT_MAX_LOOP_INTERVAL: ${CELERY_BEAT_MAX_LOOP_INTERVAL:-5}
    CELERY_BEAT_SYNC_EVERY: ${CELERY_BEAT_SYNC_EVERY:-1}
    USE_S3_STORAGE: ${USE_S3_STORAGE:-false}
    AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
    AWS_S3_ADDRESSING_STYLE: ${AWS_S3_ADDRESSING_STYLE:-auto}
    AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_USE_TLS: ${SMTP_USE_TLS:-}
    SMTP_USE_SSL: ${SMTP_USE_SSL:-}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
    IMAP_HOST: ${IMAP_HOST:-}
    IMAP_PORT: ${IMAP_PORT:-}
    IMAP_USER: ${IMAP_USER:-}
    IMAP_PASSWORD: ${IMAP_PASSWORD:-}
    IMAP_USE_SSL: ${IMAP_USE_SSL:-}
    DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
  restart: unless-stopped
  stop_grace_period: 30s
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
  logging: *default-logging

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-django_app}
      POSTGRES_USER: ${POSTGRES_USER:-django_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run/postgresql:rw,nosuid,nodev,size=16m,mode=0775
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    shm_size: ${POSTGRES_SHM_SIZE:-128m}
    mem_limit: ${POSTGRES_MEM_LIMIT:-768m}
    cpus: ${POSTGRES_CPUS:-1.0}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-256}
    logging: *default-logging
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    entrypoint:
      - /bin/sh
      - /usr/local/bin/datascientest-redis-entrypoint
    volumes:
      - redis_data:/data
      - ./redis/entrypoint.sh:/usr/local/bin/datascientest-redis-entrypoint:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=8m,mode=0755
    expose:
      - "6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli -h 127.0.0.1 -p 6379 ping | grep -qx PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    cpus: ${REDIS_CPUS:-0.50}
    pids_limit: ${REDIS_PIDS_LIMIT:-128}
    logging: *default-logging
    networks:
      - backend

  web:
    <<: *app-service
    environment:
      <<: *app-environment
      GUNICORN_BIND: 0.0.0.0:8000
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
      GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
      GUNICORN_KEEPALIVE: ${GUNICORN_KEEPALIVE:-5}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - static_data:/app/staticfiles
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=2).read(); urllib.request.urlopen('http://127.0.0.1:8000/health/database/', timeout=2).read(); urllib.request.urlopen('http://127.0.0.1:8000/health/redis/', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: ${WEB_MEM_LIMIT:-512m}
    cpus: ${WEB_CPUS:-1.0}
    pids_limit: ${WEB_PIDS_LIMIT:-256}
    networks:
      - frontend
      - backend

  worker:
    <<: *app-service
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=${CELERY_LOG_LEVEL:-INFO}
      - --concurrency=${CELERY_CONCURRENCY:-2}
      - --hostname=worker@%h
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A config inspect ping --timeout=3 2>/dev/null | grep -q pong",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: ${WORKER_MEM_LIMIT:-512m}
    cpus: ${WORKER_CPUS:-1.0}
    pids_limit: ${WORKER_PIDS_LIMIT:-256}
    networks:
      - backend

  beat:
    <<: *app-service
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=${CELERY_BEAT_LOG_LEVEL:-INFO}
      - --scheduler=django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "tr '\\0' ' ' < /proc/1/cmdline | grep -Eq 'celery .* beat|celery.*beat' && python manage.py shell -c \"from django_celery_beat.models import PeriodicTask; assert PeriodicTask.objects.filter(name='datascientest-demo-heartbeat', enabled=True).exists()\" >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: ${BEAT_MEM_LIMIT:-256m}
    cpus: ${BEAT_CPUS:-0.50}
    pids_limit: ${BEAT_PIDS_LIMIT:-128}
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/srv/static:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /var/cache/nginx:rw,nosuid,nodev,size=32m,mode=0755
      - /var/run:rw,nosuid,nodev,size=8m,mode=0755
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1/health/database/",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    mem_limit: ${NGINX_MEM_LIMIT:-128m}
    cpus: ${NGINX_CPUS:-0.50}
    pids_limit: ${NGINX_PIDS_LIMIT:-128}
    logging: *default-logging
    networks:
      - frontend

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin12345}
    volumes:
      - minio_data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mc ready local || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    mem_limit: ${MINIO_MEM_LIMIT:-512m}
    cpus: ${MINIO_CPUS:-0.50}
    pids_limit: ${MINIO_PIDS_LIMIT:-256}
    logging: *default-logging
    networks:
      - backend

  minio-create-bucket:
    image: minio/mc:RELEASE.2024-11-05T11-41-28Z
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER:-minioadmin}" "$${MINIO_ROOT_PASSWORD:-minioadmin12345}" &&
        mc mb local/"$${AWS_STORAGE_BUCKET_NAME:-dst-media}" --ignore-existing &&
        exit 0
    restart: "no"
    logging: *default-logging

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  static_data:
  minio_data:
