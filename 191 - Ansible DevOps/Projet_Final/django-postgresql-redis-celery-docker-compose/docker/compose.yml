x-app-service: &app-service
  image: ${APP_IMAGE:-datascientest-django:dev}
  build:
    context: ../django-app
    dockerfile: Dockerfile
    args:
      APPLICATION_VERSION: ${APPLICATION_VERSION:-0.0.0-dev}
      APPLICATION_COMMIT: ${APPLICATION_COMMIT:-local}
  environment: &app-environment
    APPLICATION_ENV: ${APPLICATION_ENV:-dev}
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web,nginx}
    DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for DEV Full / STG / PROD}
    CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
    CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND is required}
    CELERY_RESULT_EXPIRES: ${CELERY_RESULT_EXPIRES:-3600}
    CELERY_BEAT_MAX_LOOP_INTERVAL: ${CELERY_BEAT_MAX_LOOP_INTERVAL:-5}
    CELERY_BEAT_SYNC_EVERY: ${CELERY_BEAT_SYNC_EVERY:-1}
    DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
  restart: unless-stopped
  networks:
    - app
  stop_grace_period: 30s

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-django_app}
      POSTGRES_USER: ${POSTGRES_USER:-django_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - app

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    entrypoint:
      - /usr/local/bin/datascientest-redis-entrypoint
    volumes:
      - redis_data:/data
      - ./redis/entrypoint.sh:/usr/local/bin/datascientest-redis-entrypoint:ro
    expose:
      - "6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli -h 127.0.0.1 -p 6379 ping | grep -qx PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - app

  web:
    <<: *app-service
    environment:
      <<: *app-environment
      GUNICORN_BIND: 0.0.0.0:8000
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
      GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
      GUNICORN_KEEPALIVE: ${GUNICORN_KEEPALIVE:-5}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - static_data:/app/staticfiles
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  worker:
    <<: *app-service
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=${CELERY_LOG_LEVEL:-INFO}
      - --concurrency=${CELERY_CONCURRENCY:-2}
      - --hostname=worker@%h
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A config inspect ping --timeout=2 2>/dev/null | grep -q pong",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

  beat:
    <<: *app-service
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=${CELERY_BEAT_LOG_LEVEL:-INFO}
      - --scheduler=django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "tr '\\0' ' ' < /proc/1/cmdline | grep -Eq 'celery .* beat|celery.*beat'",
        ]
      interval: 15s
      timeout: 3s
      retries: 8
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/srv/static:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1/health/",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 5s
    restart: unless-stopped
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_data:
