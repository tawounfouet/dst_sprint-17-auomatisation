all:
  vars:
    ansible_user: datascientest
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
  children:
    datascientest_app:
      children:
        dev:
          vars:
            env: dev
          hosts:
            client-dev:
              ansible_host: <IP_CIBLE1>
        test:
          vars:
            env: test
          hosts:
            client-test:
              ansible_host: <IP_CIBLE2>
        prod:
          vars:
            env: prod
          hosts:
            client-prod:
              ansible_host: <IP_CIBLE3>
